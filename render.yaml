services:
  - type: web
    runtime: node
    name: protocol-last-core
    plan: starter
    buildCommand: npm install --no-audit --no-fund && npm --prefix client install --no-audit --no-fund && npm --prefix client run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 20.12.2
      - key: NPM_CONFIG_REGISTRY
        value: https://registry.npmjs.org/
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /var/data
      - key: CLIENT_URL
        sync: false
    disk:
      name: data
      mountPath: /var/data
      sizeGB: 10
