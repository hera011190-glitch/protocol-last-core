services:
  - type: web
    runtime: node
    name: protocol-last-core
    plan: starter
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /var/data
      - key: CLIENT_URL
        sync: false
    disk:
      name: data
      mountPath: /var/data
      sizeGB: 10
